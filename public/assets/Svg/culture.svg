<svg width="1512" height="329" viewBox="0 0 1512 329" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <!-- Primary Golden Gradient -->
    <linearGradient id="primaryGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="25%" stop-color="#FFC107"/>
      <stop offset="50%" stop-color="#FF8F00"/>
      <stop offset="75%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    
    <!-- Secondary Golden Gradient -->
    <linearGradient id="secondaryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FFAB00"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    
    <!-- Radial Golden Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFB300" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E65100" stop-opacity="0.3"/>
    </radialGradient>
    
    <!-- Metallic Shine Effect -->
    <linearGradient id="metallicShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="20%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFF176"/>
      <stop offset="60%" stop-color="#FFEB3B"/>
      <stop offset="80%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#B8860B" flood-opacity="0.4"/>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner Shadow Effect -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feFlood flood-color="#8D6E63" flood-opacity="0.3"/>
      <feComposite in2="offset-blur" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow Circle -->
  <circle cx="756" cy="164.5" r="180" fill="url(#goldGlow)" opacity="0.3"/>
  
  <!-- Enhanced Text with Multiple Effects -->

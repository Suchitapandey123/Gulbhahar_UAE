    <path d="M387.88 264.68C372.013 264.68 358.387 262.067 347 256.84C335.613 251.613 326.28 244.427 319 235.28C311.907 226.133 306.68 215.68 303.32 203.92C299.96 191.973 298.28 179.467 298.28 166.4V64.2H352.88V166.4C352.88 172.933 353.533 179.187 354.84 185.16C356.147 191.133 358.2 196.453 361 201.12C363.8 205.787 367.347 209.52 371.64 212.32C376.12 214.933 381.533 216.24 387.88 216.24C394.413 216.24 399.92 214.933 404.4 212.32C408.88 209.52 412.427 205.787 415.04 201.12C417.84 196.267 419.893 190.853 421.2 184.88C422.507 178.907 423.16 172.747 423.16 166.4V64.2H477.76V166.4C477.76 180.213 475.893 193.093 472.16 205.04C468.613 216.987 463.2 227.44 455.92 236.4C448.64 245.36 439.307 252.36 427.92 257.4C416.72 262.253 403.373 264.68 387.88 264.68ZM518.126 263V64.2H572.726V215.4H662.886V263H518.126ZM819.192 111.8H762.072V263H707.472V111.8H650.072V64.2H819.192V111.8Z" fill="url(#secondaryGold)" filter="url(#glow)"/>
  </g>
  
  <!-- Enhanced Decorative Lines with Gradients -->
  <g filter="url(#dropShadow)">
    <!-- Right decorative line with enhanced gradient -->
    <line x1="1270.86" y1="88.5004" x2="1520.86" y2="87.1192" stroke="url(#primaryGold)" stroke-width="49" stroke-linecap="round"/>
    
    <!-- Left decorative line with enhanced gradient -->
    <line x1="-13.5" y1="243.5" x2="243.5" y2="243.5" stroke="url(#secondaryGold)" stroke-width="49" stroke-linecap="round"/>
  </g>
  
  <!-- Additional Highlight Effects -->
  <g opacity="0.6">
    <!-- Top highlight on text -->
    <path d="M83.16 161.92C83.16 149.787 85.4 137.933 89.88 126.36C94.5467 114.6 101.267 103.96 110.04 94.44" stroke="#FFFDE7" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M387.88 264.68C372.013 264.68 358.387 262.067 347 256.84C335.613 251.613 326.28 244.427 319 235.28" stroke="#FFFDE7" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Subtle Sparkle Effects -->
  <g opacity="0.7">
    <circle cx="200" cy="100" r="3" fill="#FFFDE7">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="120" r="2" fill="#FFE082">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="1200" cy="90" r="2.5" fill="#FFFDE7">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="400" cy="250" r="2" fill="#FFB300">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
</svg>
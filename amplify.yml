version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install pnpm
        - corepack enable
        - corepack prepare pnpm@latest --activate

        # Clean build cache to ensure fresh builds
        - rm -rf .next
        - rm -rf node_modules

        # Install dependencies with pnpm
        - pnpm install --frozen-lockfile

        # Debug: show env variables passed from Amplify
        - echo "🔍 Checking environment variables from Amplify:"
        - env | grep NEXTAUTH || true
        - env | grep GOOGLE || true

        # Write them into .env for Next.js
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env
        - echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
        - echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env

        # Debug: show .env contents
        - echo "🔍 Final .env:"
        - cat .env

    build:
      commands:
        # Build using pnpm
        - pnpm run build

        # Verify build output doesn't contain localhost references
        - echo "🔍 Checking for localhost references in build:"
        - grep -r "localhost:3000" .next/ || echo "✅ No localhost references found"

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/.pnpm/**/*
      - .pnpm-store/**/*
